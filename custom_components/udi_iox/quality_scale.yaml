rules:
  # Bronze
  action-setup:
    status: done
    comment: |
      Services (send_node_command, get_node_commands, rename_node,
      set_zwave_parameter, get_zwave_parameter, send_program_command)
      are registered in async_setup, not async_setup_entry — see
      services.py / __init__.py.
  appropriate-polling:
    status: exempt
    comment: |
      iot_class is local_push. State is driven by the controller's
      WebSocket event stream (pyisyox EventDispatcher); the integration
      never polls.
  brands:
    status: done
    comment: |
      Brand assets shipped locally under ``brand/`` (icon.png +
      icon@2x.png); HA 2026.3+ Brands Proxy API serves them.
  common-modules:
    status: done
    comment: |
      Base entity classes live in entity.py; there is no
      DataUpdateCoordinator (the integration is push-based, with the
      event hub in controller_events.py).
  config-flow:
    status: done
    comment: |
      Full UI config flow with reauth and SSDP / DHCP discovery; option
      flow for the per-platform enable toggles and naming strings.
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: pyisyox is the only requirement, published on PyPI.
  docs-actions:
    status: done
    comment: |
      Every service is described in services.yaml and strings.json
      ("services" section).
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: done
    comment: |
      Entities subscribe to controller events in async_added_to_hass and
      tear down via async_will_remove_from_hass (ISYEntity._unsubscribers).
  entity-unique-id: done
  has-entity-name:
    status: done
    comment: |
      ISYNodeEntity sets _attr_has_entity_name = True; the few entities
      that carry a complete standalone name (programs, the root-node
      diagnostic buttons) opt out deliberately.
  runtime-data:
    status: done
    comment: ConfigEntry.runtime_data holds the IsyData container.
  test-before-configure:
    status: done
    comment: config_flow.validate_input opens a short-lived Controller before the entry is created.
  test-before-setup:
    status: done
    comment: |
      async_setup_entry awaits Controller.connect and raises
      ConfigEntryNotReady / ConfigEntryAuthFailed on failure.
  unique-config-entry:
    status: done
    comment: The config entry's unique_id is the controller UUID.

  # Silver
  action-exceptions:
    status: done
    comment: |
      Services wrap NodeCommandError / connection failures in
      HomeAssistantError (services.py).
  config-entry-unloading:
    status: done
    comment: async_unload_entry stops the controller and unloads platforms.
  docs-configuration-parameters:
    status: done
    comment: |
      README "Configuration" section + ``data_description`` strings
      cover every option-flow field.
  docs-installation-parameters:
    status: done
    comment: |
      README "Installation" section covers prereqs + every setup field;
      SSDP/DHCP and reauth in adjacent subsections.
  entity-unavailable:
    status: done
    comment: |
      ``available`` = ``node.enabled AND ws_connected``. WS disconnect
      debounced 90 s (eisy blips and reconnects within seconds);
      reconnect reported instantly. The enable switch overrides the
      ``node.enabled`` half so a disabled node is still toggleable.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      WARN once when the 90 s debounce fires, INFO on reconnect;
      transient blips DEBUG-only.
  parallel-updates:
    status: done
    comment: |
      ``PARALLEL_UPDATES = 0`` on every platform. Integration is
      push-based and pyisyox v6 dropped its per-host semaphore — the
      eisy throttles parallel writes server-side.
  reauthentication-flow:
    status: done
    comment: config_flow implements async_step_reauth / async_step_reauth_confirm.
  test-coverage:
    status: done
    comment: 98 % overall (372 tests); every platform module ≥95 %.

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: done
    comment: SSDP (X_IoX_Device:1) + DHCP.
  discovery-update-info:
    status: done
    comment: |
      _async_set_unique_id_or_update updates the stored host when SSDP /
      DHCP rediscover a configured controller at a new address.
  docs-data-update: todo
  docs-examples:
    status: done
    comment: |
      README "Automations on button presses" walks the device-trigger
      pattern with YAML and explains why state-trigger doesn't suffice.
  docs-known-limitations: todo
  docs-supported-devices:
    status: done
    comment: |
      README "Supported devices" + ``docs/supported-devices.md`` cover
      Insteon / Z-Wave / Zigbee / Matter / PG3 plugins.
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category:
    status: done
    comment: |
      Aux-control NUMBER/SELECT/BUTTON and the enable switch are
      EntityCategory.CONFIG; diagnostic readings (ERR, etc.) are
      EntityCategory.DIAGNOSTIC.
  entity-device-class:
    status: done
    comment: |
      Sensor / binary_sensor route through UOM/type tables; cover /
      lock / climate / fan / light / number / select leave it unset
      because the IoX controller doesn't surface the distinction.
  entity-disabled-by-default:
    status: done
    comment: |
      Maintenance verbs (WDU "Write Changes") and the ERR
      communication-error sensor are registry-disabled by default.
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues:
    status: done
    comment: |
      Node-lifecycle events (rename / move / enable / etc.) raise a
      Repair issue prompting an entry reload.
  stale-devices:
    status: done
    comment: |
      ``async_remove_config_entry_device`` blocks removal while
      ``IsyData.devices`` still owns the address.
  # Platinum
  async-dependency: done
  inject-websession: todo
  strict-typing:
    status: todo
    comment: |
      pyisyox ships py.typed and the integration is mypy-clean, but the
      Platinum bar (PEP 561 + full strict typing audit) hasn't been
      formally verified.
