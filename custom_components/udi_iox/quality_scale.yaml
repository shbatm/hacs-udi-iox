rules:
  # Bronze
  action-setup:
    status: done
    comment: |
      Services (send_node_command, get_node_commands, rename_node,
      set_zwave_parameter, get_zwave_parameter, send_program_command)
      are registered in async_setup, not async_setup_entry — see
      services.py / __init__.py.
  appropriate-polling:
    status: exempt
    comment: |
      iot_class is local_push. State is driven by the controller's
      WebSocket event stream (pyisyox EventDispatcher); the integration
      never polls.
  brands:
    status: done
    comment: |
      Brand assets shipped locally under
      ``custom_components/udi_iox/brand/`` (icon.png 256×256 + icon@2x.png
      512×512 — the Universal Devices mark). HA 2026.3+ serves these
      via the Brands Proxy API and prefers them over the brands CDN, so
      the udi_iox domain renders the brand mark even though the domain
      isn't registered in home-assistant/brands.
  common-modules:
    status: done
    comment: |
      Base entity classes live in entity.py; there is no
      DataUpdateCoordinator (the integration is push-based, with the
      event hub in controller_events.py).
  config-flow:
    status: done
    comment: |
      Full UI config flow with reauth and SSDP / DHCP discovery; option
      flow for the per-platform enable toggles and naming strings.
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: pyisyox is the only requirement, published on PyPI.
  docs-actions:
    status: done
    comment: |
      Every service is described in services.yaml and strings.json
      ("services" section).
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: done
    comment: |
      Entities subscribe to controller events in async_added_to_hass and
      tear down via async_will_remove_from_hass (ISYEntity._unsubscribers).
  entity-unique-id: done
  has-entity-name:
    status: done
    comment: |
      ISYNodeEntity sets _attr_has_entity_name = True; the few entities
      that carry a complete standalone name (programs, the root-node
      diagnostic buttons) opt out deliberately.
  runtime-data:
    status: done
    comment: ConfigEntry.runtime_data holds the IsyData container.
  test-before-configure:
    status: done
    comment: config_flow.validate_input opens a short-lived Controller before the entry is created.
  test-before-setup:
    status: done
    comment: |
      async_setup_entry awaits Controller.connect and raises
      ConfigEntryNotReady / ConfigEntryAuthFailed on failure.
  unique-config-entry:
    status: done
    comment: The config entry's unique_id is the controller UUID.

  # Silver
  action-exceptions:
    status: done
    comment: |
      Services wrap NodeCommandError / connection failures in
      HomeAssistantError (services.py).
  config-entry-unloading:
    status: done
    comment: async_unload_entry stops the controller and unloads platforms.
  docs-configuration-parameters:
    status: done
    comment: |
      The ``Configuration`` section of README.md documents every
      option-flow field (sensor_string, ignore_string,
      restore_light_state, enable_variables, enable_programs,
      enable_networking) with its default and behaviour. All six are
      also surfaced with ``data_description`` strings in strings.json
      so HA renders inline help on the Options dialog itself.
  docs-installation-parameters:
    status: done
    comment: |
      The ``Installation`` section of README.md documents every
      setup-flow field — Prerequisites lists what to gather before
      starting (UD portal account + controller URL) and the Setup
      Parameters table covers host / username / password /
      verify_ssl with their defaults and where to source each value.
      SSDP/DHCP discovery and the reauth flow are documented in
      adjacent subsections.
  entity-unavailable:
    status: done
    comment: |
      Entity ``available`` is now ``node.enabled AND ws_connected``.
      ``IsyControllerEvents`` subscribes to the controller's WS status
      and fans the connected flag to every entity. The disconnect
      transition is debounced by 90 s — the eisy is known to blip and
      reconnect within seconds, and reporting unavailable on every
      transient hiccup would just flicker the UI. Reconnect itself is
      reported instantly. The enable switch overrides the
      ``node.enabled`` half (else there'd be no way to re-enable a
      disabled node) but still respects WS health.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      ``IsyControllerEvents._on_ws_status`` logs a single warning when
      the 90 s debounce fires (entities flipped unavailable) and an
      info when the stream reconnects. Transient blips that recover
      within the debounce window are logged at DEBUG only — no spam.
  parallel-updates:
    status: done
    comment: |
      ``PARALLEL_UPDATES = 0`` at module top on every platform. The
      integration is push-based (no entity-update I/O — state is
      driven by the WebSocket event stream), AND the eisy on current
      IoX 6+ firmware queues / throttles parallel writes internally
      (empirical finding during pyisyox v6 development). pyisyox
      dropped its own per-host semaphore for this same reason — the
      legacy ``connection.py`` had ``asyncio.Semaphore(...)``; the
      v6 ``client.py`` rewrite has none. So there's no benefit to
      limiting action concurrency on the HA side either.
  reauthentication-flow:
    status: done
    comment: config_flow implements async_step_reauth / async_step_reauth_confirm.
  test-coverage:
    status: done
    comment: |
      98 % overall (372 tests). Every platform module clears the 95 %
      bar — 17 modules at 100 %, the rest 95-98 %. The dense
      ``binary_sensor.py`` Insteon parent / subnode classification path
      (62 % at the time of the silver test-coverage push in PR #44) is
      now at 97 %, driven by ``pyisyox.testing.make_insteon_binary_sensor_records``
      (pyisyox 6.0.0b2+).

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: done
    comment: SSDP (X_IoX_Device:1) + DHCP.
  discovery-update-info:
    status: done
    comment: |
      _async_set_unique_id_or_update updates the stored host when SSDP /
      DHCP rediscover a configured controller at a new address.
  docs-data-update: todo
  docs-examples:
    status: done
    comment: |
      ``README.md`` ``Automations on button presses`` walks through a
      device-trigger automation end-to-end with both a UI-driven walk
      and a YAML snippet for the canonical KeypadLinc → light.toggle
      pattern, and explains why the device trigger is preferred over
      a state trigger (so users coming from PyISY-3 / isy994
      automations migrate cleanly).
  docs-known-limitations: todo
  docs-supported-devices:
    status: done
    comment: |
      ``README.md`` ``Supported devices`` plus the dedicated
      ``docs/supported-devices.md`` cover Insteon / Z-Wave / Zigbee /
      Matter / PG3 plugins, with the explicit guidance to install
      HA-native integrations alongside this one for devices where
      the native one is the better source of truth (Sonos, Hue, etc.).
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category:
    status: done
    comment: |
      Aux-control NUMBER/SELECT/BUTTON and the enable switch are
      EntityCategory.CONFIG; diagnostic readings (ERR, etc.) are
      EntityCategory.DIAGNOSTIC.
  entity-device-class:
    status: done
    comment: |
      Every domain whose entities can be classified declares
      ``device_class``. Sensor + binary_sensor route through
      ``UOM_TO_DEVICE_CLASS`` / ``BINARY_SENSOR_DEVICE_TYPES_*`` so
      Insteon / Z-Wave / plugin nodes get the right class
      automatically; switch / button / event use the static
      ``SwitchDeviceClass.OUTLET`` / ``ButtonDeviceClass.RESTART`` /
      ``EventDeviceClass.BUTTON`` overrides where applicable.
      Domains without a generally-applicable class (cover, lock,
      climate, fan, light, number, select) leave it unset — the IoX
      controller doesn't surface the semantic distinction needed to
      pick one.
  entity-disabled-by-default:
    status: done
    comment: |
      Maintenance verbs (WDU "Write Changes") and the ERR
      communication-error sensor are registry-disabled by default.
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues:
    status: done
    comment: |
      Node-lifecycle events (rename / move / enable / etc.) raise a
      Repair issue prompting an entry reload.
  stale-devices:
    status: done
    comment: |
      ``__init__.async_remove_config_entry_device`` lets the user remove
      a device from the integration via the device-registry "Delete"
      action. Returns False (block deletion) when the address is still
      owned by ``IsyData.devices``; True (allow) otherwise — so a node
      that disappeared from the controller is removable, and a node
      that's still there can't be accidentally orphaned.
  # Platinum
  async-dependency: done
  inject-websession: todo
  strict-typing:
    status: todo
    comment: |
      pyisyox ships py.typed and the integration is mypy-clean, but the
      Platinum bar (PEP 561 + full strict typing audit) hasn't been
      formally verified.
