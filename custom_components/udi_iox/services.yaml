# IoX integration services. Targeting many entities in one call may
# flood the controller — use a scene defined on the controller instead.

send_node_command:
  target:
    entity:
      integration: udi_iox
  fields:
    command:
      required: true
      selector:
        select:
          options:
            - "beep"
            - "brighten"
            - "dim"
            - "disable"
            - "enable"
            - "fade_down"
            - "fade_stop"
            - "fade_up"
            - "fast_off"
            - "fast_on"
            - "query"

get_node_commands:
  target:
    entity:
      integration: udi_iox

rename_node:
  target:
    entity:
      integration: udi_iox
  fields:
    name:
      required: true
      example: "Hallway Dimmer"
      selector:
        text:

set_zwave_parameter:
  target:
    entity:
      integration: udi_iox
  fields:
    parameter:
      required: true
      example: 24
      selector:
        number:
          min: 1
          max: 255
          mode: box
    value:
      required: true
      example: 1
      selector:
        number:
          min: -2147483648
          max: 2147483647
          mode: box
    size:
      required: true
      example: 1
      selector:
        select:
          options:
            - "1"
            - "2"
            - "4"

get_zwave_parameter:
  target:
    entity:
      integration: udi_iox
  fields:
    parameter:
      required: true
      example: 24
      selector:
        number:
          min: 1
          max: 255
          mode: box

send_program_command:
  fields:
    address:
      example: "04B1"
      selector:
        text:
    name:
      example: "My Program"
      selector:
        text:
    command:
      required: true
      selector:
        select:
          options:
            - "disable"
            - "disable_run_at_startup"
            - "enable"
            - "enable_run_at_startup"
            - "run"
            - "run_else"
            - "run_then"
            - "stop"
    isy:
      example: "00:21:b9:01:23:45"
      selector:
        text:
