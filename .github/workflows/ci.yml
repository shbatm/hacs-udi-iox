name: CI

"on":
  push:
    branches:
      - main
      - dev
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hassfest:
    # Fast, deterministic — runs on every PR as the merge gate.
    runs-on: ubuntu-latest
    name: Hassfest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # HACS validation flakes on transient PR branches (the action fetches
    # the branch by name via the GH API; short-lived PR refs sometimes
    # 404 / fall back to default mid-run). It's a release-readiness check
    # so we only run it on main + nightly.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: HACS
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    runs-on: ubuntu-latest
    name: Check code style
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: no-commit-to-branch,mypy,pylint
