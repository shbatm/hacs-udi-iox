name: CI

"on":
  push:
    branches:
      - main
      - dev
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hassfest:
    # Fast, deterministic — runs on every PR as the merge gate.
    runs-on: ubuntu-latest
    name: Hassfest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # HACS validation flakes on transient PR branches (the action fetches
    # the branch by name via the GH API; short-lived PR refs sometimes
    # 404 / fall back to default mid-run). It's a release-readiness check
    # so we only run it on main + nightly.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: HACS
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    runs-on: ubuntu-latest
    name: Check code style
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: pip install pre-commit
      # Runs pre-commit directly instead of pre-commit/action@v3.0.1 --
      # that action is unmaintained (last release Feb 2024) and pins an
      # internal actions/cache step to Node 20, which GitHub now force-runs
      # on Node 24 with a deprecation warning on every job.
      - name: Run pre-commit
        env:
          SKIP: no-commit-to-branch,mypy,pylint
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    name: Run tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # HA 2026.5+ runs on Python 3.14; match the devcontainer.
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -U pip "setuptools>=70.0" wheel
          # Mirror .devcontainer/scripts/setup_ha_test_env.sh: HA test
          # extras (pulls pytest-homeassistant-custom-component-compatible
          # HA + helpers), the integration's runtime deps, and the test
          # toolchain. ``--pre`` tracks the same HA pre-release the
          # devcontainer / snapshots were generated against.
          python -m pip install --pre --prefer-binary "homeassistant[tests]>=2026.4"
          python -m pip install -r requirements.txt
          python -m pip install -U pytest pytest-asyncio pytest-timeout \
            pytest-homeassistant-custom-component
      - name: Run pytest
        # --timeout caps a hung async fixture / stray network call so the
        # job fails fast instead of spinning to the runner limit.
        run: python -m pytest tests/ -q --no-cov --timeout=60
